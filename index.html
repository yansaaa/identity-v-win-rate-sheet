<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Identity V win-rate tracker with filters, import/export, and edit/delete." />
  <title>Identity V Win Rate Tracker</title>
  <style>
    :root {
      --bg: #f3f7ff;
      --bg-elevated: #ffffff;
      --panel: #ffffff;
      --panel-alt: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --border: #dfe7f3;
      --primary: #7c3aed;
      --primary-2: #8b5cf6;
      --secondary: #38bdf8;
      --success: #16a34a;
      --danger: #dc2626;
      --shadow: 0 16px 26px rgba(15, 23, 42, 0.08);
      --shadow-soft: 0 8px 22px rgba(15, 23, 42, 0.06);
      --focus: rgba(124, 58, 237, 0.2);
    }

    [data-theme="dark"] {
      --bg: #0b1220;
      --bg-elevated: #111827;
      --panel: #111827;
      --panel-alt: #0f172a;
      --text: #e5eefb;
      --muted: #cbd5e1;
      --border: #27364c;
      --primary: #a78bfa;
      --primary-2: #8b5cf6;
      --secondary: #38bdf8;
      --success: #4ade80;
      --danger: #f87171;
      --shadow: 0 16px 26px rgba(2, 6, 23, 0.5);
      --focus: rgba(168, 85, 247, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(circle at top left, rgba(124, 58, 237, 0.35), transparent 28%),
        radial-gradient(circle at bottom right, rgba(56, 189, 248, 0.35), transparent 32%),
        linear-gradient(135deg, var(--bg) 0%, var(--bg-elevated) 100%);
      color: var(--text);
      transition: background 0.25s ease, color 0.25s ease;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .app-shell {
      width: min(1200px, calc(100% - 24px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 4px;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      opacity: 0.9;
    }

    .app-header h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      letter-spacing: -0.04em;
    }

    .theme-toggle {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      cursor: pointer;
      transition: 0.2s ease;
      font-size: 1.3rem;
    }

    .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-soft);
      padding: 22px;
    }

    .panel h2 {
      margin: 0 0 18px;
      font-size: 1.35rem;
    }

    .stats-overview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }

    .stat-card {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
      color: white;
      padding: 18px 18px 20px;
      border-radius: 16px;
      text-align: center;
      box-shadow: var(--shadow-soft);
    }

    .stat-card.success {
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    }

    .stat-card.secondary {
      background: linear-gradient(135deg, var(--secondary) 0%, #0284c7 100%);
    }

    .stat-icon {
      font-size: 1.7rem;
      margin-bottom: 6px;
    }

    .stat-card h2 {
      margin: 0 0 8px;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      opacity: 0.9;
    }

    .stat-value {
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 800;
      margin: 0;
    }

    .match-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 16px;
    }

    .form-row.full {
      grid-template-columns: 1fr;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-weight: 600;
      color: var(--text);
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-alt);
      color: var(--text);
    }

    .primary-btn,
    .secondary-btn,
    .page-btn,
    .mini-btn,
    .danger-btn {
      min-height: 44px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
      color: white;
      padding: 10px 22px;
      box-shadow: 0 10px 22px rgba(124, 58, 237, 0.2);
    }

    .primary-btn:hover,
    .secondary-btn:hover,
    .page-btn:hover,
    .mini-btn:hover,
    .danger-btn:hover {
      transform: translateY(-1px);
    }

    .secondary-btn {
      background: var(--panel-alt);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 14px;
    }

    .danger-btn {
      background: rgba(220, 38, 38, 0.12);
      color: var(--danger);
      border: 1px solid rgba(220, 38, 38, 0.2);
      padding: 9px 14px;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .filter-bar input,
    .filter-bar select {
      flex: 1 1 180px;
      min-height: 46px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-alt);
      color: var(--text);
    }

    .data-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .file-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .data-message {
      margin: 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--text);
      font-weight: 600;
    }

    .form-error {
      margin: 0;
      background: rgba(220, 38, 38, 0.12);
      color: var(--danger);
      min-height: 24px;
      border-radius: 10px;
      border: 1px solid rgba(220, 38, 38, 0.2);
      padding: 8px 10px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .stat-item {
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
    }

    .stat-item strong {
      display: block;
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .rate {
      font-size: clamp(1.4rem, 1.8vw, 2rem);
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .stat-item small {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    thead {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
    }

    thead th {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .result-win {
      color: var(--success);
      font-weight: 700;
    }

    .result-loss {
      color: var(--danger);
      font-weight: 700;
    }

    .actions-cell {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mini-btn {
      background: var(--panel-alt);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .danger-mini-btn {
      background: rgba(220, 38, 38, 0.08);
      color: var(--danger);
      border-color: rgba(220, 38, 38, 0.2);
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
    }

    .page-btn {
      background: var(--panel-alt);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
    }

    .empty-row {
      text-align: center;
      color: var(--muted);
      font-weight: 600;
    }

    .empty-state {
      width: 100%;
      padding: 20px;
      text-align: center;
      color: var(--muted);
      border-radius: 12px;
      border: 1px dashed var(--border);
    }

    @media (max-width: 760px) {
      .app-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .filter-bar {
        flex-direction: column;
      }

      .stats-overview {
        grid-template-columns: repeat(2, 1fr);
      }

      .table-wrap {
        overflow-x: auto;
      }
    }

    @media (max-width: 520px) {
      .app-shell {
        width: min(100% - 16px);
      }

      .stats-overview {
        grid-template-columns: 1fr;
      }

      .data-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .secondary-btn,
      .danger-btn,
      .primary-btn {
        width: 100%;
      }

      .pagination {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Tracker</p>
        <h1>Identity V Win Rate Sheet</h1>
      </div>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">☀️</button>
    </header>

    <main class="container">
      <section class="stats-overview" aria-label="Overall statistics">
        <article class="stat-card">
          <div class="stat-icon">🎮</div>
          <h2>Total Matches</h2>
          <p id="totalMatches" class="stat-value">0</p>
        </article>

        <article class="stat-card success">
          <div class="stat-icon">✅</div>
          <h2>Total Wins</h2>
          <p id="totalWins" class="stat-value">0</p>
        </article>

        <article class="stat-card">
          <div class="stat-icon">📊</div>
          <h2>Win Rate</h2>
          <p id="winRate" class="stat-value">0%</p>
        </article>

        <article class="stat-card secondary">
          <div class="stat-icon">⏱️</div>
          <h2>Avg Duration</h2>
          <p id="avgDuration" class="stat-value">0 min</p>
        </article>
      </section>

      <section class="panel">
        <h2>Log New Match</h2>
        <form id="matchForm" class="match-form">
          <div class="form-row">
            <div class="field">
              <label for="date">Date</label>
              <input id="date" type="date" required />
            </div>
            <div class="field">
              <label for="character">Character</label>
              <input id="character" type="text" maxlength="50" required placeholder="e.g. Naib" />
            </div>
            <div class="field">
              <label for="map">Map</label>
              <input id="map" type="text" maxlength="50" required placeholder="e.g. Red Church" />
            </div>
          </div>

          <div class="form-row">
            <div class="field">
              <label for="role">Role</label>
              <select id="role" required>
                <option value="">Select role</option>
                <option value="survivor">Survivor</option>
                <option value="hunter">Hunter</option>
              </select>
            </div>
            <div class="field">
              <label for="result">Result</label>
              <select id="result" required>
                <option value="">Select result</option>
                <option value="true">Win</option>
                <option value="false">Loss</option>
              </select>
            </div>
            <div class="field">
              <label for="duration">Duration (min)</label>
              <input id="duration" type="number" min="1" max="300" step="1" required placeholder="e.g. 20" />
            </div>
          </div>

          <div class="form-row full">
            <div class="field">
              <label for="notes">Notes</label>
              <input id="notes" type="text" maxlength="200" placeholder="Optional notes" />
            </div>
          </div>

          <p id="formError" class="form-error" role="alert" hidden></p>
          <button type="submit" class="primary-btn">Add Match</button>
        </form>
      </section>

      <section class="panel">
        <h2>Filters</h2>
        <div class="filter-bar">
          <input id="searchInput" type="search" placeholder="Search character, map, notes..." />
          <select id="filterRole">
            <option value="">All roles</option>
            <option value="survivor">Survivor</option>
            <option value="hunter">Hunter</option>
          </select>
          <select id="filterResult">
            <option value="">All results</option>
            <option value="true">Wins</option>
            <option value="false">Losses</option>
          </select>
          <button id="clearFiltersBtn" type="button" class="secondary-btn">Reset</button>
        </div>
      </section>

      <section class="panel">
        <h2>Data Management</h2>
        <div class="data-actions">
          <button id="exportJsonBtn" type="button" class="secondary-btn">Export JSON</button>
          <button id="exportCsvBtn" type="button" class="secondary-btn">Export CSV</button>
          <label for="importFile" class="secondary-btn file-label">Import File</label>
          <input id="importFile" type="file" accept=".json,.csv" hidden />
          <button id="resetDataBtn" type="button" class="danger-btn">Clear All</button>
        </div>
        <p id="dataMessage" class="data-message" role="status" aria-live="polite" hidden></p>
      </section>

      <section class="panel">
        <h2>Win Rate by Character</h2>
        <div id="characterStats" class="stats-grid"></div>
      </section>

      <section class="panel">
        <h2>Win Rate by Map</h2>
        <div id="mapStats" class="stats-grid"></div>
      </section>

      <section class="panel">
        <h2>Match History</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Character</th>
                <th>Map</th>
                <th>Role</th>
                <th>Result</th>
                <th>Duration</th>
                <th>Notes</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="matchBody"></tbody>
          </table>
        </div>
        <nav class="pagination" aria-label="Match history pagination">
          <button id="previousPage" type="button" class="page-btn">Previous</button>
          <span id="pageInfo">Page 1 of 1</span>
          <button id="nextPage" type="button" class="page-btn">Next</button>
        </nav>
      </section>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "identityVMatches";
    const THEME_KEY = "theme-preference";
    const PAGE_SIZE = 25;

    let matches = [];
    let currentPage = 1;

    const $ = (id) => document.getElementById(id);

    function normalizeMatch(value) {
      if (!value || typeof value !== "object") return null;

      const duration = Number(value.duration_minutes);
      const date = typeof value.date === "string" ? value.date.trim() : "";
      const character = typeof value.character === "string" ? value.character.trim() : "";
      const map = typeof value.map === "string" ? value.map.trim() : "";
      const role = value.role === "hunter" || value.role === "survivor" ? value.role : "";
      const notes = typeof value.notes === "string" ? value.notes.trim().slice(0, 200) : "";
      const won = value.won === true || value.won === "true";

      if (!date || !character || !map || !role || !Number.isFinite(duration) || duration < 1) {
        return null;
      }

      return { id: Number.isFinite(Number(value.id)) ? Number(value.id) : Date.now(), date, character, map, role, won, duration_minutes: Math.round(duration), notes };
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed.map(normalizeMatch).filter(Boolean) : [];
      } catch (error) {
        console.warn("Could not load matches", error);
        return [];
      }
    }

    function saveData(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (error) {
        console.warn("Could not save matches", error);
      }
    }

    function getPreferredTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === "light" || saved === "dark") return saved;
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem(THEME_KEY, theme);
      const toggle = $("themeToggle");
      if (toggle) toggle.textContent = theme === "dark" ? "🌙" : "☀️";
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme") || "light";
      setTheme(current === "dark" ? "light" : "dark");
    }

    function createBucket() {
      return { wins: 0, total: 0, durationSum: 0 };
    }

    function aggregateStats(data) {
      const overall = { total: 0, wins: 0, durationSum: 0 };
      const characters = new Map();
      const maps = new Map();

      for (const match of data) {
        const duration = match.duration_minutes;
        overall.total += 1;
        overall.wins += match.won ? 1 : 0;
        overall.durationSum += duration;

        [[characters, match.character], [maps, match.map]].forEach(([group, key]) => {
          const bucket = group.get(key) || createBucket();
          bucket.total += 1;
          bucket.wins += match.won ? 1 : 0;
          bucket.durationSum += duration;
          group.set(key, bucket);
        });
      }

      return { overall, characters, maps };
    }

    function displayStats(stats, keyName) {
      return [...stats.entries()]
        .map(([key, data]) => ({ [keyName]: key, ...data, losses: data.total - data.wins, winRate: data.total ? (data.wins / data.total) * 100 : 0 }))
        .sort((a, b) => b.winRate - a.winRate || b.total - a.total);
    }

    function renderStats(overall) {
      $("totalMatches").textContent = overall.total;
      $("totalWins").textContent = overall.wins;
      $("winRate").textContent = `${overall.total ? ((overall.wins / overall.total) * 100).toFixed(1) : "0.0"}%`;
      $("avgDuration").textContent = `${overall.total ? (overall.durationSum / overall.total).toFixed(1) : "0.0"} min`;
    }

    function renderGroupStats(containerId, stats, keyName) {
      const container = $(containerId);
      container.replaceChildren();

      const values = displayStats(stats, keyName);

      if (!values.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No matches recorded yet.";
        container.appendChild(empty);
        return;
      }

      const fragment = document.createDocumentFragment();
      values.forEach((stat) => {
        const item = document.createElement("div");
        item.className = "stat-item";

        const name = document.createElement("strong");
        name.textContent = stat[keyName];

        const rate = document.createElement("div");
        rate.className = "rate";
        rate.textContent = `${stat.winRate.toFixed(1)}%`;

        const record = document.createElement("small");
        record.textContent = `${stat.wins}W / ${stat.losses}L`;

        item.append(name, rate, record);
        fragment.appendChild(item);
      });

      container.appendChild(fragment);
    }

    function getFilteredMatches() {
      const search = $("searchInput").value.trim().toLowerCase();
      const role = $("filterRole").value;
      const result = $("filterResult").value;

      return matches.filter((match) => {
        const haystack = `${match.character} ${match.map} ${match.notes}`.toLowerCase();
        const matchesRole = !role || match.role === role;
        const matchesResult = result === "" || String(match.won) === result;
        const matchesSearch = !search || haystack.includes(search);
        return matchesRole && matchesResult && matchesSearch;
      });
    }

    function addCell(row, text, className = "") {
      const cell = document.createElement("td");
      cell.textContent = text;
      if (className) cell.className = className;
      row.appendChild(cell);
    }

    function renderMatchTable(data) {
      const sorted = [...data].sort((a, b) => b.id - a.id);
      const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
      currentPage = Math.min(Math.max(currentPage, 1), totalPages);

      const pageMatches = sorted.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

      const body = $("matchBody");
      body.replaceChildren();

      if (!pageMatches.length) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 8;
        cell.textContent = "No matches found.";
        cell.className = "empty-row";
        body.appendChild(row).appendChild(cell);
        $("pageInfo").textContent = "Page 1 of 1";
        $("previousPage").disabled = true;
        $("nextPage").disabled = true;
        return;
      }

      pageMatches.forEach((match) => {
        const row = document.createElement("tr");

        addCell(row, match.date);
        addCell(row, match.character);
        addCell(row, match.map);
        addCell(row, match.role.charAt(0).toUpperCase() + match.role.slice(1));
        addCell(row, match.won ? "Win" : "Loss", match.won ? "result-win" : "result-loss");
        addCell(row, `${match.duration_minutes} min`);
        addCell(row, match.notes || "-");

        const actions = document.createElement("td");
        actions.className = "actions-cell";

        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className = "mini-btn";
        editBtn.textContent = "Edit";
        editBtn.dataset.id = String(match.id);
        editBtn.addEventListener("click", () => editMatch(match.id));

        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "mini-btn danger-mini-btn";
        deleteBtn.textContent = "Delete";
        deleteBtn.dataset.id = String(match.id);
        deleteBtn.addEventListener("click", () => deleteMatch(match.id));

        actions.append(editBtn, deleteBtn);
        row.appendChild(actions);

        body.appendChild(row);
      });

      $("pageInfo").textContent = `Page ${currentPage} of ${totalPages}`;
      $("previousPage").disabled = currentPage === 1;
      $("nextPage").disabled = currentPage === totalPages;
    }

    function renderAll() {
      const filteredMatches = getFilteredMatches();
      const { overall, characters, maps } = aggregateStats(filteredMatches);

      renderStats(overall);
      renderGroupStats("characterStats", characters, "character");
      renderGroupStats("mapStats", maps, "map");
      renderMatchTable(filteredMatches);
    }

    function showFormError(message = "") {
      const error = $("formError");
      error.textContent = message;
      error.hidden = !message;
    }

    function showDataMessage(message = "") {
      const msg = $("dataMessage");
      if (!msg) return;
      msg.textContent = message;
      msg.hidden = !message;
    }

    function handleSubmit(event) {
      event.preventDefault();
      showFormError();

      const form = event.currentTarget;
      if (!form.reportValidity()) return;

      const match = normalizeMatch({
        id: Date.now(),
        date: $("date").value,
        character: $("character").value,
        map: $("map").value,
        role: $("role").value,
        won: $("result").value === "true",
        duration_minutes: $("duration").value,
        notes: $("notes").value
      });

      if (!match) {
        showFormError("Please enter valid match details.");
        return;
      }

      matches.push(match);
      saveData(matches);
      renderAll();

      form.reset();
      $("date").valueAsDate = new Date();
      $("character").focus();
      showDataMessage("Match added successfully.");
    }

    function escapeCsv(value) {
      const text = String(value ?? "");
      const escaped = text.replace(/"/g, '""');
      return /[",\n]/.test(escaped) ? `"${escaped}"` : escaped;
    }

    function downloadFile(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportJson() {
      const timestamp = new Date().toISOString().slice(0, 10);
      downloadFile(`identity-v-matches-${timestamp}.json`, JSON.stringify(matches, null, 2), "application/json");
      showDataMessage("Data exported as JSON.");
    }

    function exportCsv() {
      const rows = matches.map((match) => [
        match.date,
        match.character,
        match.map,
        match.role,
        match.won ? "true" : "false",
        match.duration_minutes,
        match.notes || ""
      ]);

      const csv = [
        ["date", "character", "map", "role", "won", "duration_minutes", "notes"],
        ...rows
      ]
        .map((row) => row.map(escapeCsv).join(","))
        .join("\n");

      const timestamp = new Date().toISOString().slice(0, 10);
      downloadFile(`identity-v-matches-${timestamp}.csv`, csv, "text/csv;charset=utf-8;");
      showDataMessage("Data exported as CSV.");
    }

    function parseCsvLine(line) {
      const values = [];
      let current = "";
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];

        if (char === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ",") {
          if (!inQuotes) {
            values.push(current.trim());
            current = "";
          } else {
            current += char;
          }
        } else {
          current += char;
        }
      }

      values.push(current.trim());
      return values;
    }

    function normalizeImportedCsv(csvText) {
      const lines = csvText.split(/\r?\n/).filter((line) => line.trim() !== "");
      if (lines.length < 2) {
        throw new Error("CSV must include a header row and at least one row.");
      }

      const headers = parseCsvLine(lines[0]).map((h) => h.toLowerCase().trim());
      const required = ["date", "character", "map", "role", "won", "duration_minutes", "notes"];

      const missing = required.filter((key) => !headers.includes(key));
      if (missing.length) {
        throw new Error(`CSV missing required columns: ${missing.join(", ")}`);
      }

      const imported = [];

      for (let i = 1; i < lines.length; i++) {
        const row = parseCsvLine(lines[i]);
        const record = {};

        headers.forEach((header, index) => {
          record[header] = row[index] ?? "";
        });

        const normalized = normalizeMatch({
          id: Date.now() + i,
          date: record.date,
          character: record.character,
          map: record.map,
          role: record.role,
          won: record.won === "true" || record.won === "True",
          duration_minutes: record.duration_minutes,
          notes: record.notes || ""
        });

        if (normalized) imported.push(normalized);
      }

      if (!imported.length) {
        throw new Error("No valid matches found in the CSV file.");
      }

      return imported;
    }

    function importJson(text) {
      const parsed = JSON.parse(text);

      if (!Array.isArray(parsed)) {
        throw new Error("JSON file must contain an array of matches.");
      }

      const imported = parsed.map(normalizeMatch).filter(Boolean);

      if (!imported.length) {
        throw new Error("No valid matches found in the JSON file.");
      }

      matches = imported;
      saveData(matches);
      renderAll();
      showDataMessage(`Imported ${imported.length} match${imported.length === 1 ? "" : "es"} from JSON.`);
    }

    function importCsv(text) {
      const imported = normalizeImportedCsv(text);
      matches = imported;
      saveData(matches);
      renderAll();
      showDataMessage(`Imported ${imported.length} match${imported.length === 1 ? "" : "es"} from CSV.`);
    }

    function handleImport(file) {
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const text = String(reader.result || "");
          const lower = file.name.toLowerCase();

          if (lower.endsWith(".csv")) {
            importCsv(text);
          } else if (lower.endsWith(".json")) {
            importJson(text);
          } else {
            throw new Error("Unsupported file type. Please select a JSON or CSV file.");
          }
        } catch (error) {
          console.error(error);
          showDataMessage(error.message || "Import failed.");
        }
      };

      reader.onerror = () => {
        showDataMessage("Could not read the selected file.");
      };

      reader.readAsText(file);
    }

    function deleteMatch(id) {
      const entry = matches.find((match) => match.id === id);
      if (!entry) return;

      const confirmed = window.confirm(`Delete this match for ${entry.character}?`);
      if (!confirmed) return;

      matches = matches.filter((match) => match.id !== id);
      saveData(matches);
      renderAll();
      showDataMessage("Match deleted.");
    }

    function editMatch(id) {
      const match = matches.find((item) => item.id === id);
      if (!match) return;

      $("date").value = match.date;
      $("character").value = match.character;
      $("map").value = match.map;
      $("role").value = match.role;
      $("result").value = String(match.won);
      $("duration").value = match.duration_minutes;
      $("notes").value = match.notes;

      const form = $("matchForm");
      const submitButton = form.querySelector('button[type="submit"]');
      submitButton.textContent = "Update Match";
      form.dataset.editingId = String(id);

      showDataMessage(`Editing match for ${match.character}.`);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function finalizeEdit() {
      const form = $("matchForm");
      const editingId = form.dataset.editingId;

      if (!editingId) return;

      const matchIndex = matches.findIndex((match) => match.id === Number(editingId));
      if (matchIndex === -1) return;

      const updatedMatch = normalizeMatch({
        id: Number(editingId),
        date: $("date").value,
        character: $("character").value,
        map: $("map").value,
        role: $("role").value,
        won: $("result").value === "true",
        duration_minutes: $("duration").value,
        notes: $("notes").value
      });

      if (!updatedMatch) {
        showFormError("Please enter valid match details.");
        return;
      }

      matches[matchIndex] = updatedMatch;
      saveData(matches);
      renderAll();

      form.reset();
      $("date").valueAsDate = new Date();

      const submitButton = form.querySelector('button[type="submit"]');
      submitButton.textContent = "Add Match";
      delete form.dataset.editingId;

      showDataMessage("Match updated.");
    }

    function clearAllData() {
      const hasData = matches.length > 0;
      if (!hasData) {
        showDataMessage("There are no matches to clear.");
        return;
      }

      const confirmed = window.confirm("Delete all saved matches? This cannot be undone.");
      if (!confirmed) return;

      matches = [];
      saveData(matches);
      renderAll();
      showDataMessage("All matches cleared.");
    }

    function bindEvents() {
      $("matchForm").addEventListener("submit", (event) => {
        if ($("matchForm").dataset.editingId) {
          event.preventDefault();
          finalizeEdit();
          return;
        }

        handleSubmit(event);
      });

      $("searchInput").addEventListener("input", () => {
        currentPage = 1;
        renderAll();
      });

      $("filterRole").addEventListener("change", () => {
        currentPage = 1;
        renderAll();
      });

      $("filterResult").addEventListener("change", () => {
        currentPage = 1;
        renderAll();
      });

      $("clearFiltersBtn").addEventListener("click", () => {
        $("searchInput").value = "";
        $("filterRole").value = "";
        $("filterResult").value = "";
        currentPage = 1;
        renderAll();
      });

      $("previousPage").addEventListener("click", () => {
        if (currentPage > 1) {
          currentPage -= 1;
          renderAll();
        }
      });

      $("nextPage").addEventListener("click", () => {
        const filtered = getFilteredMatches();
        const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
        if (currentPage < totalPages) {
          currentPage += 1;
          renderAll();
        }
      });

      $("exportJsonBtn").addEventListener("click", exportJson);
      $("exportCsvBtn").addEventListener("click", exportCsv);
      $("resetDataBtn").addEventListener("click", clearAllData);
      $("importFile").addEventListener("change", (event) => {
        const [file] = event.target.files;
        handleImport(file);
        event.target.value = "";
      });

      $("themeToggle").addEventListener("click", toggleTheme);
    }

    document.addEventListener("DOMContentLoaded", () => {
      setTheme(getPreferredTheme());

      matches = loadData();
      $("date").valueAsDate = new Date();

      bindEvents();
      renderAll();
    });
  </script>
</body>
</html>
